version: "3.9"

services:
  mosquitto:
    image: eclipse-mosquitto:2.0
    container_name: aiot-mosquitto
    ports:
      - "1883:1883"
      - "8083:8083"   # WebSocket untuk browser
      - "8883:8883"   # TLS
    volumes:
      - ./mosquitto/mosquitto.conf:/mosquitto/config/mosquitto.conf
      - mosquitto-data:/mosquitto/data
    restart: unless-stopped

  influxdb:
    image: influxdb:2.7
    container_name: aiot-influxdb
    ports: ["8086:8086"]
    environment:
      DOCKER_INFLUXDB_INIT_MODE: setup
      DOCKER_INFLUXDB_INIT_USERNAME: admin
      DOCKER_INFLUXDB_INIT_PASSWORD: admin12345
      DOCKER_INFLUXDB_INIT_ORG: aiot
      DOCKER_INFLUXDB_INIT_BUCKET: telemetry
      DOCKER_INFLUXDB_INIT_ADMIN_TOKEN: dev-token-please-change
    volumes:
      - influx-data:/var/lib/influxdb2
    restart: unless-stopped

  postgres:
    image: postgres:16-alpine
    container_name: aiot-postgres
    ports: ["5432:5432"]
    environment:
      POSTGRES_USER: aiot
      POSTGRES_PASSWORD: aiot_dev
      POSTGRES_DB: aiot
    volumes:
      - pg-data:/var/lib/postgresql/data
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: aiot-redis
    ports: ["6379:6379"]
    restart: unless-stopped

  minio:
    image: minio/minio:latest
    container_name: aiot-minio
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin123
    volumes:
      - minio-data:/data
    restart: unless-stopped

volumes:
  mosquitto-data:
  influx-data:
  pg-data:
  minio-data:
